name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use your own signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AIO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using signing key from repository secrets"
          else
            echo "No signing secrets set: using a temporary debug key (see README > Signing)"
          fi

      - name: Build APKs
        env:
          AIO_KEYSTORE_PASSWORD: ${{ secrets.AIO_KEYSTORE_PASSWORD }}
          AIO_KEY_ALIAS: ${{ secrets.AIO_KEY_ALIAS }}
          AIO_KEY_PASSWORD: ${{ secrets.AIO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIO-Tracker-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/AIO-Tracker-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AIO-Tracker-${{ github.run_number }}
          path: dist/*.apk

      - name: Unit & UI smoke tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish release (default branch only)
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AIO Tracker build ${{ github.run_number }}
          body: |
            Install `AIO-Tracker-${{ github.run_number }}.apk` on your Android phone (Android 8.0+).
            Built from ${{ github.sha }}.
          files: dist/AIO-Tracker-${{ github.run_number }}.apk
